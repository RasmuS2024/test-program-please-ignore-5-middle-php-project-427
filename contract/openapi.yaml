openapi: 3.0.0
info:
  title: Flight Booking API
  version: 0.0.0
tags: []
paths:
  /api/cities:
    get:
      operationId: Cities_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
components:
  schemas:
    City:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        country:
          type: string
